<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AI 酒店与行程智能体</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    /* 安卓移动端基准：360dp 宽度 */
    --dp-baseline: 360;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    /* 严格以设备宽度为基准，禁止横向滚动和任何放大缩小 */
    min-width: 0;
    max-width: 100vw;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
    touch-action: manipulation;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: border-box; }
  /* 禁用用户手势缩放（安卓浏览器兼容） */
  html {
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  /* 确保输入框在所有移动端设备上不自动放大 */
  input, textarea, select, button {
    font-size: 16px; /* >= 16px 防止 iOS 自动聚焦放大；安卓同步保持 */
  }

  /* ========== 球体动画 ========== */
  @keyframes breathe {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.08); opacity: 0.78; }
  }
  @keyframes breathe-slow {
    0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.5; }
    50% { transform: scale(1.1) translate(-4%, 4%); opacity: 0.72; }
  }
  @keyframes float-y {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  @keyframes sparkle {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(1.2) rotate(12deg); opacity: 0.85; }
  }
  .orb-1 { animation: breathe 5s ease-in-out infinite; }
  .orb-2 { animation: breathe-slow 6.5s ease-in-out infinite; animation-delay: -1.5s; }
  .orb-3 { animation: breathe 7s ease-in-out infinite; animation-delay: -3s; }
  .orb-core { animation: float-y 4.5s ease-in-out infinite; }
  .sparkle-icon { animation: sparkle 2.8s ease-in-out infinite; }

  /* ========== 列表切换：淡出 -> 更新 -> 淡入上浮 ========== */
  .list-hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }
  .list-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 300ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* ========== 卡片入场错峰 ========== */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .card-in { animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both; }

  /* ========== 输入舱柔光 ========== */
  @keyframes softPulse {
    0%, 100% { box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    50% { box-shadow: 0 8px 36px rgba(59, 130, 246, 0.2); }
  }
  .input-cabin-focused { animation: softPulse 2.2s ease-in-out infinite; }

  /* ========== 小渐变图标 ========== */
  .mini-icon-1 { background: linear-gradient(135deg, #a78bfa 0%, #60a5fa 100%); }
  .mini-icon-2 { background: linear-gradient(135deg, #fbbf24 0%, #fb7185 100%); }
  .mini-icon-3 { background: linear-gradient(135deg, #34d399 0%, #22d3ee 100%); }

  /* ========== Tab 指示条过渡 ========== */
  .tab-underline {
    position: absolute;
    height: 3px;
    bottom: -1px;
    border-radius: 999px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    transition: left 320ms cubic-bezier(0.22, 1, 0.36, 1),
                width 320ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* ========== 卡片响应式文字（360dp 基准） ========== */
  .prompt-card-title {
    font-size: clamp(0.78rem, 3.4vw, 0.9rem);
  }
  .prompt-card-tag {
    font-size: clamp(0.62rem, 2.6vw, 0.7rem);
  }
  /* ========== 历史对话抽屉动画 ========== */
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideInRight { from { transform: translateX(100%) } to { transform: translateX(0) } }
  .history-mask { animation: fadeIn 0.25s ease-out both; }
  .history-panel { animation: slideInRight 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  .history-item.active {
    background: linear-gradient(90deg, rgba(59,130,246,0.1), rgba(99,102,241,0.06));
    border-left: 3px solid #6366f1;
  }
</style>

      </button>

      <!-- 发送按钮 -->
      <button id="sendBtn" class="flex-shrink-0 ml-1 w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center shadow-sm opacity-50 cursor-not-allowed">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>

    <div class="text-center mt-2 text-[clamp(0.62rem,2.5vw,0.68rem)] text-gray-400/80 leading-none">
      内容由 AI 生成 · 出行前请核实信息
    </div>
  </div>

</div>


<script>
(function() {
  // ============ 三套数据源 ============
  var TAB_DATA = {
    idea: [
      { icon: '✨', text: '不想人挤人，有哪些小众治愈的周边出游地？', tag: '小众 · 治愈 · 周边', iconClass: 'mini-icon-1' },
      { icon: '🚶‍♀️', text: '适合和闺蜜/情侣/室友一起的短途出游地点？', tag: '短途 · 好友 · 性价比', iconClass: 'mini-icon-2' },
      { icon: '📸', text: '有没有适合 Citywalk 拍照出片的旅行地推荐？', tag: '打卡 · 出片 · Citywalk', iconClass: 'mini-icon-3' }
    ],
    plan: [
      { icon: '🎒', text: '周末和3个朋友去奥体看演唱会，帮我安排3日游', tag: '多人 · 演唱会 · 3天', iconClass: 'mini-icon-3' },
      { icon: '🗺️', text: '帮我规划 A 市不早起、少走路的周末出游路线', tag: '休闲 · 轻松 · 周末', iconClass: 'mini-icon-1' }
    ],
    hotel: [
      { icon: '🏨', text: '奥体附近，预算400内，干净步行5分钟到地铁的酒店', tag: '奥体 · 400内 · 地铁近', iconClass: 'mini-icon-1' },
      { icon: '🛏️', text: '适合学生党多人出行，性价比极高的高颜值民宿', tag: '学生党 · 多人 · 高颜值', iconClass: 'mini-icon-2' }
    ]
  };

  var currentTab = 'idea';
  var input = document.getElementById('mainInput');
  var sendBtn = document.getElementById('sendBtn');
  var inputCabin = document.getElementById('inputCabin');
  var promptList = document.getElementById('promptList');
  var tabBtns = document.querySelectorAll('.tab-btn');
  var underline = document.getElementById('tabUnderline');

  // ============ 渲染卡片列表 ============
  function renderCards(tabKey, withAnim) {
    var data = TAB_DATA[tabKey] || [];
    var html = '';
    data.forEach(function(item, idx) {
      var delay = (idx * 0.06).toFixed(2) + 's';
      var anim = withAnim ? ('card-in style="animation-delay:' + delay + '"') : '';
      html +=
        '<button class="prompt-card group w-full text-left ' + anim + ' bg-white/80 backdrop-blur-md border border-white rounded-xl p-2.5 shadow-sm hover:shadow-md active:scale-[0.99] transition-all duration-200">' +
          '<div class="flex items-start gap-2.5">' +
            '<div class="' + item.iconClass + ' w-8 h-8 rounded-xl flex items-center justify-center text-white text-sm flex-shrink-0 shadow-sm">' +
              item.icon +
            '</div>' +
            '<div class="flex-1 min-w-0">' +
              '<div class="prompt-card-title font-semibold text-gray-800 leading-snug">' + item.text + '</div>' +
              '<div class="prompt-card-tag text-gray-400 mt-1">' + item.tag + '</div>' +
            '</div>' +
            '<svg class="w-4 h-4 text-gray-300 group-active:translate-x-0.5 transition-transform flex-shrink-0 mt-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>' +
          '</div>' +
        '</button>';
    });
    promptList.innerHTML = html;
    bindCardEvents();
  }

  // ============ 绑定卡片点击（填入输入舱） ============
  function bindCardEvents() {
    var cards = promptList.querySelectorAll('.prompt-card');
    cards.forEach(function(card) {
      card.addEventListener('click', function() {
        var text = card.querySelector('.text-gray-800').textContent.trim();
        input.value = text;
        input.focus();
        inputCabin.classList.add('input-cabin-focused');
        card.animate(
          [{ background: 'rgba(219, 234, 254, 0.6)' }, { background: 'rgba(255, 255, 255, 0.8)' }],
          { duration: 450, easing: 'ease-out' }
        );
      });
    });
  }

  // ============ 移动 Tab 下划线 ============
  function moveUnderline(activeBtn) {
    if (!activeBtn) return;
    var rect = activeBtn.getBoundingClientRect();
    var parentRect = activeBtn.parentElement.getBoundingClientRect();
    var left = rect.left - parentRect.left;
    underline.style.left = left + 'px';
    underline.style.width = rect.width + 'px';
  }

  // ============ Tab 切换：淡出 -> 更新内容 -> 淡入上浮 ============
  function switchTab(tabKey, btn) {
    if (tabKey === currentTab) return;

    // 1) UI 更新
    tabBtns.forEach(function(b) {
      b.classList.remove('font-bold', 'text-gray-800');
      b.classList.add('font-semibold', 'text-gray-400');
    });
    btn.classList.remove('font-semibold', 'text-gray-400');
    btn.classList.add('font-bold', 'text-gray-800');
    moveUnderline(btn);

    // 2) 淡出当前列表
    promptList.classList.remove('list-visible');
    promptList.classList.add('list-hidden');

    // 3) 等淡出完成 -> 换数据 -> 淡入上浮
    setTimeout(function() {
      currentTab = tabKey;
      renderCards(tabKey, false);
      // 强制回流，使 transition 生效
      // eslint-disable-next-line no-unused-expressions
      promptList.offsetHeight;
      promptList.classList.remove('list-hidden');
      promptList.classList.add('list-visible');
      // 重新触发 card-in 错峰入场
      var els = promptList.querySelectorAll('.prompt-card');
      els.forEach(function(el, idx) {
        el.classList.add('card-in');
        el.style.animationDelay = (idx * 0.06).toFixed(2) + 's';
      });
    }, 240);
  }

  // ============ Tab 点击绑定 ============
  tabBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.getAttribute('data-tab');
      switchTab(key, btn);
    });
  });

  // ============ 输入框聚焦 ============
  input.addEventListener('focus', function() {
    inputCabin.classList.add('input-cabin-focused');
  });
  input.addEventListener('blur', function() {
    inputCabin.classList.remove('input-cabin-focused');
  });

  // ============ 发送跳转 ============
  function handleSend() {
    var val = input.value.trim();
    if (val) {
      try { sessionStorage.setItem('welcome_prompt', val); } catch(e) {}
    }
    window.location.href = 'view1_scene1_exact.html';
  }
  // 发送按钮已禁用，不可交互
  // sendBtn.addEventListener('click', handleSend);
  // input.addEventListener('keydown', function(e) {
  //   if (e.key === 'Enter') handleSend();
  // });

  // ============ 初始化 ============
  function init() {
    // 初始数据和 Tab UI
    var active = document.querySelector('.tab-btn[data-tab="' + currentTab + '"]');
    if (active) {
      active.classList.remove('font-semibold', 'text-gray-400');
      active.classList.add('font-bold', 'text-gray-800');
    }
    // 等布局稳定后，定位下划线
    setTimeout(function() {
      moveUnderline(active);
      renderCards(currentTab, true);
    }, 30);

    // 窗口 resize 也修正下划线位置
    window.addEventListener('resize', function() {
      var cur = document.querySelector('.tab-btn[data-tab="' + currentTab + '"]');
      moveUnderline(cur);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
<script>
// ===== 历史对话抽屉 =====
(function() {
  var mask = document.getElementById('historyMask');
  var openBtn = document.getElementById('historyBtn');
  var closeBtn = document.getElementById('historyClose');
  function openHistory() { mask && mask.classList.remove('hidden'); }
  function closeHistory() { mask && mask.classList.add('hidden'); }
  openBtn && openBtn.addEventListener('click', openHistory);
  closeBtn && closeBtn.addEventListener('click', closeHistory);
  mask && mask.querySelector('.history-mask') && mask.querySelector('.history-mask').addEventListener('click', closeHistory);
})();
</script>
