  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .hotel-scroll { overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
  .hotel-scroll::-webkit-scrollbar { height: 6px; display: block; }
  .hotel-scroll::-webkit-scrollbar-track { background: #f3f4f6; border-radius: 3px; margin: 0 4px; }
  .hotel-scroll::-webkit-scrollbar-thumb { background: linear-gradient(90deg, #3b82f6, #6366f1); border-radius: 3px; min-width: 30px; border: 1px solid #fff; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-enter { animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .typing-dots span {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background-color: #3b82f6; margin: 0 2px;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* 历史对话抽屉动画 */
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideInRight { from { transform: translateX(100%) } to { transform: translateX(0) } }
  .history-mask { animation: fadeIn 0.25s ease-out both; }
  .history-panel { animation: slideInRight 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  .history-item.active {
    background: linear-gradient(90deg, rgba(59,130,246,0.1), rgba(99,102,241,0.06));
    border-left: 3px solid #6366f1;
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const chatStream = document.getElementById('chatStream');
  const typing = document.getElementById('typingIndicator');
  const chatArea = document.getElementById('chatArea');

  // ===== 历史对话抽屉 =====
  const mask = document.getElementById('historyMask');
  const openBtn = document.getElementById('historyBtn');
  const closeBtn = document.getElementById('historyClose');
  function openHistory() { mask.classList.remove('hidden'); }
  function closeHistory() { mask.classList.add('hidden'); }
  openBtn && openBtn.addEventListener('click', openHistory);
  closeBtn && closeBtn.addEventListener('click', closeHistory);
  mask && mask.querySelector('.history-mask').addEventListener('click', closeHistory);

  function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }
  function showTyping() { typing.classList.remove('hidden'); typing.classList.add('flex'); scrollBottom(); }
  function hideTyping() { typing.classList.add('hidden'); typing.classList.remove('flex'); }

  function userBubble(text, delay) {
    const div = document.createElement('div');
    div.className = 'flex justify-end mb-4 msg-enter';
    div.style.animationDelay = (delay || 0) + 'ms';
    div.innerHTML = `
      <div class="max-w-[75%] bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-md">
        <p class="text-sm leading-relaxed">${text}</p>
      </div>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 ml-2 flex-shrink-0 mt-1 flex items-center justify-center shadow-md">
        <span class="text-white text-xs font-bold">我</span>
      </div>`;
    chatStream.appendChild(div);
    setTimeout(scrollBottom, 30);
  }

  function aiBubble(text, delay) {
    const div = document.createElement('div');
    div.className = 'flex justify-start mb-4 msg-enter';
    div.style.animationDelay = (delay || 0) + 'ms';
    div.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 mr-2 flex-shrink-0 mt-1 flex items-center justify-center shadow-md">
        <span class="text-white text-xs font-bold">智</span>
      </div>
      <div class="max-w-[88%] bg-white/80 backdrop-blur-md border border-white/60 rounded-2xl rounded-tl-sm shadow-sm px-4 py-3">
        <p class="text-sm text-gray-700 leading-relaxed">${text}</p>
      </div>`;
    chatStream.appendChild(div);
    setTimeout(scrollBottom, 30);
  }

  function transportCard(delay) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-4 ml-10 msg-enter';
    wrap.style.animationDelay = (delay || 0) + 'ms';
    wrap.innerHTML = `
      <div class="rounded-2xl bg-white/80 backdrop-blur-md border border-white/60 p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1.5">
            <span class="text-lg">🚄</span>
            <span class="text-base font-bold text-gray-800">上海虹桥 ➔ 南京南</span>
          </div>
          <span class="text-xs text-orange-500 bg-orange-50/80 px-2 py-0.5 rounded-full border border-orange-100/50">限时抢票</span>
        </div>
        <div class="space-y-3">
          <div class="border border-gray-100/50 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2"><span class="text-base font-bold text-gray-900">G123</span><span class="text-xs text-gray-500">复兴号 · 1.5h</span></div>
              <span class="text-xs text-green-600 bg-green-50/80 px-2 py-0.5 rounded-full">🟢 余票充足</span>
            </div>
            <div class="flex items-center justify-between">
              <div class="text-center"><div class="text-lg font-bold text-gray-900">09:00</div><div class="text-xs text-gray-500">上海虹桥</div></div>
              <div class="flex-1 px-3"><div class="h-px bg-gray-200 relative"><div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-500 rounded-full px-2 py-0.5"><span class="text-white text-xs font-semibold">1.5h</span></div></div></div>
              <div class="text-center"><div class="text-lg font-bold text-gray-900">10:30</div><div class="text-xs text-gray-500">南京南</div></div>
            </div>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100/50">
              <div><span class="text-lg font-bold text-orange-500">¥228</span><span class="text-xs text-gray-500"> 二等座</span></div>
              <button class="bg-blue-500 text-white text-xs font-semibold px-4 py-1.5 rounded-full shadow-sm">抢票</button>
            </div>
          </div>
          <div class="border border-gray-100/50 rounded-xl p-3">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center gap-2"><span class="text-base font-bold text-gray-900">G456</span><span class="text-xs text-gray-500">和谐号 · 1.7h</span></div>
              <span class="text-xs text-orange-500 bg-orange-50/80 px-2 py-0.5 rounded-full">🟠 仅剩3张</span>
            </div>
            <div class="flex items-center justify-between">
              <div class="text-center"><div class="text-lg font-bold text-gray-900">09:30</div><div class="text-xs text-gray-500">上海虹桥</div></div>
              <div class="flex-1 px-3"><div class="h-px bg-gray-200 relative"><div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-500 rounded-full px-2 py-0.5"><span class="text-white text-xs font-semibold">1.7h</span></div></div></div>
              <div class="text-center"><div class="text-lg font-bold text-gray-900">11:15</div><div class="text-xs text-gray-500">南京南</div></div>
            </div>
            <div class="flex items-center justify-between mt-2 pt-2 border-t border-gray-100/50">
              <div><span class="text-lg font-bold text-orange-500">¥228</span><span class="text-xs text-gray-500"> 二等座</span></div>

      </div>`;
    chatStream.appendChild(wrap);
    setTimeout(scrollBottom, 30);
  }

  function hotelCardList(delay) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-4 ml-10 msg-enter';
    wrap.style.animationDelay = (delay || 0) + 'ms';
    wrap.innerHTML = `
      <div class="px-1">
        <div class="flex items-center justify-between mb-3 px-2">
          <span class="text-base font-bold text-gray-800">🏨 为你挑选 3 家酒店</span>

                <span class="bg-green-50 text-green-600 text-xs px-1.5 py-0.5 rounded-md border border-green-100/50">干净连锁</span>
              </div>
              <div class="flex items-center justify-between">
                <div><span class="text-lg font-bold text-orange-500">¥350</span><span class="text-xs text-gray-500">/晚</span></div>
                <button onclick="window.location.href='view2_hotel_detail.html'" class="text-xs bg-blue-500 text-white px-3 py-1 rounded-full font-medium">查看详情</button>

            </div>
            <div class="snap-start w-56 rounded-2xl bg-white/80 backdrop-blur-md border border-white/60 p-4 shadow-sm flex-shrink-0">
              <div class="w-full h-24 rounded-xl mb-2 overflow-hidden bg-gray-200"><img src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover"></div>

                <button class="text-xs bg-blue-500 text-white px-3 py-1 rounded-full font-medium">查看详情</button>
              </div>
            </div>
            <div class="snap-start w-56 rounded-2xl bg-white/80 backdrop-blur-md border border-white/60 p-4 shadow-sm flex-shrink-0">
              <div class="w-full h-24 rounded-xl mb-2 overflow-hidden bg-gray-200"><img src="https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover"></div>
              <div class="text-lg font-bold text-gray-900 mb-1">夫子庙桔子水晶</div>
              <div class="flex flex-wrap gap-1 mb-2"><span class="bg-orange-50 text-orange-600 text-xs px-1.5 py-0.5 rounded-md border border-orange-100/50">近景区</span></div>
              <div class="flex items-center justify-between">
                <div><span class="text-lg font-bold text-orange-500">¥320</span><span class="text-xs text-gray-500">/晚</span></div>
                <button class="text-xs bg-blue-500 text-white px-3 py-1 rounded-full font-medium">查看详情</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="px-3 pb-4 mt-2">
        <button class="w-full bg-gradient-to-r from-gray-50 to-blue-50 border border-blue-200/50 text-blue-500 font-semibold py-2.5 rounded-xl flex items-center justify-center gap-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span>换一换其他方案</span>
        </button>
      </div>`;
    chatStream.appendChild(wrap);
    setTimeout(scrollBottom, 30);
  }

  // ========== 检测 URL 参数 ==========
  const urlParams = new URLSearchParams(window.location.search);
  const rhythmLabel = urlParams.get('rhythm');

  if (rhythmLabel) {
    // 从 view2 返回：历史对话直接出现（无动画延迟），再追加新对话
    userBubble('下周五和3个朋友去南京奥体看周杰伦演唱会，计划旅行三天，帮我选一个方便去场馆同时能兼顾市内citywalk游玩的，预算400以内一晚一间，要干净近地铁，还没买高铁票。');
    aiBubble('没问题！已为您查找到符合要求的高铁车次，周三上午余票充足，建议尽快锁定行程：');
    transportCard(0);
    aiBubble('车票搞定！接下来根据您提到的「兼顾 Citywalk、400元以内且近地铁」，我为您精选了以下几套高性价比酒店方案：');
    hotelCardList(0);

    // 追加新对话（有渐进延迟）
    setTimeout(() => {
      userBubble('帮我根据「' + rhythmLabel + '」生成专属行程');
    }, 600);
    setTimeout(() => { showTyping(); }, 1500);
    setTimeout(() => {
      hideTyping();
      aiBubble('好的！已为您根据「' + rhythmLabel + '」节奏生成专属行程，快来看看预览吧：');
    }, 2700);
    setTimeout(() => { itineraryPreviewCard(rhythmLabel, 0); }, 3500);

  } else {
    // ========== 正常渐进式对话流（无参数时） ==========
    // 1. 用户精确需求（右侧蓝色气泡）
    userBubble('下周五和3个朋友去南京奥体看周杰伦演唱会，计划旅行三天，帮我选一个方便去场馆同时能兼顾市内citywalk游玩的，预算400以内一晚一间，要干净近地铁，还没买高铁票。', 0);

    // 2. AI 打字中
    setTimeout(() => { showTyping(); }, 1000);

    // 3. AI 回复高铁文案
    setTimeout(() => {
      hideTyping();
      aiBubble('没问题！已为您查找到符合要求的高铁车次，周三上午余票充足，建议尽快锁定行程：');
    }, 2200);

    // 4. 交通卡片
    setTimeout(() => { transportCard(0); }, 3100);

    // 5. AI 引导酒店文案
    setTimeout(() => {
      aiBubble('车票搞定！接下来根据您提到的「兼顾 Citywalk、400元以内且近地铁」，我为您精选了以下几套高性价比酒店方案：');
    }, 4100);

    // 6. 酒店卡片列表
    setTimeout(() => { hotelCardList(0); }, 5100);
  }

  // 行程预览结果卡
  function itineraryPreviewCard(rhythm, delay) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-4 ml-10 msg-enter';
    wrap.style.animationDelay = (delay || 0) + 'ms';

    // 根据节奏生成不同描述
    const rhythmDesc = {
      '轻松舒适': 'Day1: 抵达入住 → 夫子庙漫步 → 老门东晚餐\nDay2: 中山陵(上午) → 新街口午餐 → 玄武湖泛舟\nDay3: 鸡鸣寺早茶 → 颐和路拍照 → 返程',
      '适中兼顾': 'Day1: 抵达 → 总统府 → 1912街区 → 奥体演唱会\nDay2: 中山陵 → 明孝陵 → 新街口 → 秦淮河夜游\nDay3: 南京博物院 → 夫子庙 → 返程',
      '紧凑特种兵': 'Day1: 抵达 → 鸡鸣寺 → 玄武湖 → 总统府 → 演唱会\nDay2: 中山陵 → 明孝陵 → 美龄宫 → 新街口 → 老门东\nDay3: 南博 → 夫子庙 → 大报恩寺 → 返程'
    };
    const desc = rhythmDesc[rhythm] || rhythmDesc['适中兼顾'];
    const dayCount = desc.split('\n').length;

    wrap.innerHTML = `
      <div class="rounded-2xl bg-white/80 backdrop-blur-md border border-white/60 p-4 shadow-sm">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-1.5">
            <span class="text-lg">🗺️</span>
            <span class="text-base font-bold text-gray-800">南京3日行程预览</span>
          </div>
          <span class="text-xs text-blue-600 bg-blue-50/80 px-2 py-0.5 rounded-full border border-blue-100/50">${rhythm}</span>
        </div>
        <div class="space-y-2 mb-3">
          ${desc.split('\n').map((line, i) => `
            <div class="flex items-start gap-2 rounded-xl bg-gray-50/60 border border-gray-100/50 px-3 py-2">
              <div class="flex-shrink-0 w-6 h-6 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-white text-[10px] font-bold mt-0.5">${i + 1}</div>
              <div class="text-[12px] text-gray-600 leading-relaxed flex-1">${line}</div>
            </div>
          `).join('')}
        </div>
        <div class="flex items-center justify-between text-[11px] text-gray-400 mb-3 px-1">
          <span>${dayCount}天 · 含交通+住宿+景点</span>
          <span>AI 智能规划</span>
        </div>
        <button onclick="window.location.href='view3_timeline.html'" class="w-full bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-sm font-semibold py-2.5 rounded-xl shadow-sm flex items-center justify-center gap-1.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="5 12 12 5 19 12"></polyline><line x1="12" y1="5" x2="12" y2="19"></line></svg>
          查看行程
        </button>
      </div>`;
    chatStream.appendChild(wrap);
    setTimeout(scrollBottom, 30);
  }
});
</script>
