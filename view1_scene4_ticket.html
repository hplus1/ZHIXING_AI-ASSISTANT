<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-enter { animation: fadeInUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }

  .typing-dots span {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background-color: #3b82f6; margin: 0 2px;
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  /* 闪烁闪电图标 */
  @keyframes boltFlash {
    0%, 100% { opacity: 1; transform: scale(1) rotate(-6deg); filter: drop-shadow(0 0 4px rgba(249,115,22,0.5)); }
    40%       { opacity: 0.55; transform: scale(1.18) rotate(4deg); filter: drop-shadow(0 0 12px rgba(249,115,22,0.9)); }
    70%       { opacity: 0.9;  transform: scale(0.95) rotate(-1deg); filter: drop-shadow(0 0 2px rgba(249,115,22,0.3)); }
  }
  .bolt-blink { display: inline-block; transform-origin: center; animation: boltFlash 1.05s ease-in-out infinite; }

  /* 进度条流动 */
  @keyframes flowBar {
    0%   { background-position: 0 0; }
    100% { background-position: 40px 0; }
  }
  .flow-stripes {
    background-image: linear-gradient(
      135deg,
      rgba(255,255,255,0.25) 0%,
      rgba(255,255,255,0.25) 25%,
      rgba(59,130,246,0.1) 25%,
      rgba(59,130,246,0.1) 50%,
      rgba(255,255,255,0.25) 50%,
      rgba(255,255,255,0.25) 75%,
      rgba(59,130,246,0.1) 75%
    );
    background-size: 40px 40px;
    animation: flowBar 1.2s linear infinite;
  }

  /* 历史对话抽屉动画 */
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideInRight { from { transform: translateX(100%) } to { transform: translateX(0) } }
  .history-mask { animation: fadeIn 0.25s ease-out both; }
  .history-panel { animation: slideInRight 0.3s cubic-bezier(0.22,1,0.36,1) both; }
  .history-item.active {
    background: linear-gradient(90deg, rgba(59,130,246,0.1), rgba(99,102,241,0.06));
    border-left: 3px solid #6366f1;
  }
</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const chatStream = document.getElementById('chatStream');
  const typing = document.getElementById('typingIndicator');
  const chatArea = document.getElementById('chatArea');

  // ===== 历史对话抽屉 =====
  const mask = document.getElementById('historyMask');
  const openBtn = document.getElementById('historyBtn');
  const closeBtn = document.getElementById('historyClose');
  function openHistory() { mask.classList.remove('hidden'); }
  function closeHistory() { mask.classList.add('hidden'); }
  openBtn && openBtn.addEventListener('click', openHistory);
  closeBtn && closeBtn.addEventListener('click', closeHistory);
  mask && mask.querySelector('.history-mask').addEventListener('click', closeHistory);

  function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }
  function showTyping() { typing.classList.remove('hidden'); typing.classList.add('flex'); scrollBottom(); }
  function hideTyping() { typing.classList.add('hidden'); typing.classList.remove('flex'); }

  function userBubble(text, delay) {
    const div = document.createElement('div');
    div.className = 'flex justify-end mb-4 msg-enter';
    div.style.animationDelay = (delay || 0) + 'ms';
    div.innerHTML = `
      <div class="max-w-[78%] bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-md">
        <p class="text-sm leading-relaxed">${text}</p>
      </div>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 ml-2 flex-shrink-0 mt-1 flex items-center justify-center shadow-md">
        <span class="text-white text-xs font-bold">我</span>
      </div>`;
    chatStream.appendChild(div);
    setTimeout(scrollBottom, 30);
  }

  function aiBubble(text, delay) {
    const div = document.createElement('div');
    div.className = 'flex justify-start mb-4 msg-enter';
    div.style.animationDelay = (delay || 0) + 'ms';
    div.innerHTML = `
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-500 mr-2 flex-shrink-0 mt-1 flex items-center justify-center shadow-md">
        <span class="text-white text-xs font-bold">智</span>
      </div>
      <div class="max-w-[90%] bg-white/80 backdrop-blur-md border border-white/60 rounded-2xl rounded-tl-sm shadow-sm px-4 py-3">
        <p class="text-sm text-gray-700 leading-relaxed">${text}</p>
      </div>`;
    chatStream.appendChild(div);
    setTimeout(scrollBottom, 30);
  }

  // 兜底方案：垂直玻璃态 3 选项卡
  function fallbackCardGroup(delay, options) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-4 ml-10 msg-enter';
    wrap.style.animationDelay = (delay || 0) + 'ms';

    const rows = options.map(opt => {
      // 左侧图标
      let iconBox = '';
      if (opt.kind === 'grab') {
        iconBox = `
          <div class="flex-shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br from-orange-400 to-amber-300 flex items-center justify-center shadow-sm mr-3">
            <span class="bolt-blink text-xl">⚡</span>
          </div>`;
      } else if (opt.kind === 'transfer') {
        iconBox = `
          <div class="flex-shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br from-orange-200 to-amber-100 flex items-center justify-center shadow-sm mr-3 border border-orange-100/50">
            <span class="text-lg">🔁</span>
          </div>`;
      } else if (opt.kind === 'longer') {
        iconBox = `
          <div class="flex-shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-200 to-indigo-100 flex items-center justify-center shadow-sm mr-3 border border-blue-100/50">
            <span class="text-lg">🎯</span>
          </div>`;
      }

      let tag = '';
      if (opt.tagText) {
        tag = `<span class="text-[10px] px-2 py-0.5 rounded-full ${opt.tagClass}">${opt.tagText}</span>`;
      }

      let extra = '';
      if (opt.kind === 'grab') {
        extra = `
          <div class="mt-1.5">
            <div class="flex items-center text-[11px] text-gray-500 mb-1">
              <span>双通道抢票中</span><span class="mx-1">·</span>
              <span class="text-orange-600 font-semibold">预计成功率 78%</span>
            </div>
            <div class="w-full h-1.5 rounded-full bg-gray-100 overflow-hidden">
              <div class="flow-stripes h-full rounded-full" style="width: 78%;"></div>
            </div>
          </div>`;
      }

      return `
        <div class="flex items-stretch rounded-xl bg-white/75 backdrop-blur-sm border border-white/80 p-3 ${opt.kind==='grab' ? 'ring-1 ring-orange-200/60' : ''}">
          ${iconBox}
          <div class="flex-1 min-w-0 flex flex-col justify-center pr-2">
            <div class="flex items-center gap-2 mb-0.5 flex-wrap">
              <span class="text-[13px] font-semibold text-gray-900 leading-snug">${opt.title}</span>
              ${tag}
            </div>
            <div class="text-[11.5px] text-gray-500 leading-snug">${opt.desc}</div>
            ${extra}
          </div>
          <div class="flex-shrink-0 flex items-center">
            <button class="${opt.btnClass} text-[12px] font-semibold px-3.5 py-2 rounded-full shadow-sm whitespace-nowrap">
              ${opt.btnText}
            </button>
          </div>
        </div>`;
    }).join('<div class="h-2"></div>');

    wrap.innerHTML = `
      <div class="rounded-2xl bg-white/80 backdrop-blur-md border border-white/60 p-3.5 shadow-sm">
        <div class="flex items-center justify-between mb-2.5 px-0.5">
          <div class="flex items-center gap-1.5">
            <span class="text-base">🛟</span>
            <span class="text-[13px] font-bold text-gray-800">兜底方案 · 三选一 / 组合</span>
          </div>
          <span class="text-[10px] text-gray-500">AI 实时监控</span>
        </div>
        ${rows}
      </div>`;
    chatStream.appendChild(wrap);
    setTimeout(scrollBottom, 30);
  }

  // 成功通知卡（抢直达 + 锁中转）
  function doubleBookingNotice(delay) {
    const wrap = document.createElement('div');
    wrap.className = 'mb-4 ml-10 msg-enter';
    wrap.style.animationDelay = (delay || 0) + 'ms';
    wrap.innerHTML = `
      <div class="rounded-2xl bg-gradient-to-br from-blue-50/80 to-indigo-50/80 backdrop-blur-md border border-blue-100/50 p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-lg">✅</span>
          <span class="text-[13px] font-bold text-gray-800">双管齐下 · 已同时启动</span>
        </div>
        <div class="space-y-2.5">
          <div class="flex items-center justify-between rounded-xl bg-white/80 border border-orange-100/60 px-3 py-2">
            <div class="flex items-center gap-2 min-w-0">
              <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-orange-400 to-amber-300 flex items-center justify-center flex-shrink-0"><span class="bolt-blink text-sm">⚡</span></div>
              <div class="min-w-0">
                <div class="text-[12.5px] font-semibold text-gray-900 truncate">AI 极速抢直达</div>
                <div class="text-[10.5px] text-gray-500 flex items-center gap-1.5"><span class="inline-block w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>天津 → 南京 · 排队中 78%</div>
              </div>
            </div>
            <span class="text-[10px] bg-orange-50 text-orange-600 border border-orange-100/70 rounded-full px-2 py-0.5 flex-shrink-0 ml-2">抢票中</span>
          </div>
          <div class="flex items-center justify-between rounded-xl bg-white/80 border border-amber-100/70 px-3 py-2">
            <div class="flex items-center gap-2 min-w-0">
              <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-orange-200 to-amber-100 flex items-center justify-center flex-shrink-0"><span class="text-sm">🔁</span></div>
              <div class="min-w-0">
                <div class="text-[12.5px] font-semibold text-gray-900 truncate">中转方案已锁座</div>
                <div class="text-[10.5px] text-gray-500">天津西 → 济南西 → 南京南</div>
              </div>
            </div>
            <span class="text-[10px] bg-green-50 text-green-600 border border-green-100/70 rounded-full px-2 py-0.5 flex-shrink-0 ml-2">已锁定</span>
          </div>
        </div>
        <button class="mt-3.5 w-full bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-[12.5px] font-semibold py-2.5 rounded-xl shadow-sm">
          打开「我的订单」查看详情
        </button>
      </div>`;
    chatStream.appendChild(wrap);
    setTimeout(scrollBottom, 30);
  }

  // ========== 对话流（首条自动，后续点击按钮触发用户消息，AI 自动回复） ==========
  const sendBtn = document.getElementById('sendBtn');
  const input = document.getElementById('messageInput');

  const fallbackOptions = [
    {
      kind: 'grab',
      title: 'AI 双通道抢直达票',
      tagText: '优先方案',
      tagClass: 'bg-orange-50 text-orange-600 border border-orange-100/70',
      desc: '官方余票监测 + 退票捡漏双通道，有票立即为您下单',
      btnText: '优先抢直达',
      btnClass: 'bg-gradient-to-r from-orange-500 to-amber-500 text-white'
    },
    {
      kind: 'transfer',
      title: '智能中转方案',
      tagText: '中转方案',
      tagClass: 'bg-orange-100 text-orange-700 border border-orange-200/80',
      desc: '天津西 ➔ 济南西 ➔ 南京南（多40分钟，目前有票）',
      btnText: '锁定中转',
      btnClass: 'bg-orange-100 text-orange-700'
    },
    {
      kind: 'longer',
      title: '买长乘短 · 跨站票',
      tagText: '跨站方案',
      tagClass: 'bg-blue-100 text-blue-700 border border-blue-200/80',
      desc: '天津西 ➔ 镇江南（多坐1站，南京南下车，有票）',
      btnText: '购买跨站',
      btnClass: 'bg-blue-100 text-blue-700'
    }
  ];

  // 需要点击按钮触发的后续轮次
  const rounds = [
    {
      user: '那先帮我抢直达的，同时把中转的也订上保底',
      ai: '安排！已为您双管齐下：直达票进入 AI 极速抢票队列，中转方案已锁定座位。两项操作可在订单中查看。',
      after: () => { setTimeout(() => doubleBookingNotice(0), 500); }
    }
  ];

  let currentRound = 0;
  let isBusy = false;

  function disableSend() {
    sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
    sendBtn.classList.remove('active:scale-[0.94]');
    sendBtn.onclick = null;
  }

  function nextRound() {
    if (isBusy || currentRound >= rounds.length) return;
    isBusy = true;

    const round = rounds[currentRound];
    userBubble(round.user);

    // AI 自动回复
    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        hideTyping();
        aiBubble(round.ai);
        if (round.after) {
          setTimeout(() => { round.after(); finishRound(); }, 700);
        } else {
          finishRound();
        }
      }, 1200);
    }, 500);
  }

  function finishRound() {
    currentRound++;
    isBusy = false;
    if (currentRound >= rounds.length) {
      disableSend();
    }
  }

  // 第一轮自动播放：用户开场白 → AI 回复 → 兜底卡片
  setTimeout(() => {
    userBubble('10月1日天津到南京的高铁票怎么全没了？我还等着去看演唱会呢');
  }, 600);
  setTimeout(() => { showTyping(); }, 1800);
  setTimeout(() => {
    hideTyping();
    aiBubble('抱歉，10月1日天津→南京的直达高铁目前已售罄。别担心，我已为您同时启动以下抢票与备选方案：');
  }, 3000);
  setTimeout(() => { fallbackCardGroup(0, fallbackOptions); }, 3800);

  // 绑定发送按钮（触发后续轮次）
  sendBtn.addEventListener('click', nextRound);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); nextRound(); }
  });
});
</script>
</body>
</html>
