  // 每个 round = 点击一次 → 右侧用户气泡 → 自动 AI 打字 + 左侧气泡（+卡片）
  const rounds = [
    { user: '上海出发，4个人，周五到周日住两晚', ai: '了解。酒店方面有什么偏好吗？比如预算、是否优先近地铁？' },
    { user: '预算400以内一晚，要优先近地铁，干净就行，不要离场馆太远', ai: '好的，高铁票需要一起查吗？去程偏好周四晚上还是周五早上？' },
    { user: '一起查吧，周五早上走', ai: '没问题！已为您生成方案：', card: () => transportCard(0) },
    { user: null, ai: '车票搞定！接下来根据您提到的「兼顾 Citywalk、400元以内且近地铁」，我为您精选了以下几套高性价比酒店方案：', card: () => hotelCardList(0) },
  ];

  let currentRound = 0;
  let isBusy = false;

  function disableSend() {
    sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
    sendBtn.classList.remove('active:scale-[0.94]');
    sendBtn.onclick = null;
  }

  function nextRound() {
    if (isBusy || currentRound >= rounds.length) return;
    isBusy = true;

    const round = rounds[currentRound];

    // 显示用户消息（第4轮没有用户消息，直接 AI）
    if (round.user) {
      userBubble(round.user);
    }

    // AI 自动回复
    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        hideTyping();
        aiBubble(round.ai);
        // 如果有卡片，延迟加载
        if (round.card) {
          setTimeout(() => {
            round.card();
            finishRound();
          }, 700);
        } else {
          finishRound();
        }
      }, 1200);
    }, round.user ? 500 : 0);
  }

  function finishRound() {
    currentRound++;
    isBusy = false;
    if (currentRound >= rounds.length) {
      disableSend();
    }
  }

  // 页面初始化：显示第一条用户消息 + AI 自动追问
  userBubble('下周五想去南京看周杰伦演唱会，帮我安排一下');
  setTimeout(() => {
    showTyping();
    setTimeout(() => {
      hideTyping();
      aiBubble('好的，为了帮您找到最合适的方案，想确认几个信息：您从哪个城市出发？一共几位同行？计划住几晚呢？');
    }, 1200);
  }, 600);

  // 绑定发送按钮
  sendBtn.addEventListener('click', nextRound);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); nextRound(); }
  });
});
</script>
</body>
</html>
