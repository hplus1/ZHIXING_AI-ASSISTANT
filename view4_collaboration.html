<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行程协作</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes successPop {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    30% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f3f4f6;
    -webkit-tap-highlight-color: transparent;
  }
  .wish-item { animation: fadeInUp 0.35s ease-out both; }
  .btn-loader {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
  }
  .success-toast {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(17, 24, 39, 0.92);
    color: #fff;
    padding: 14px 22px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: successPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }
  .hidden-el { display: none !important; }

  /* 自定义复选框 */
  .wish-checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border: 2px solid #d1d5db;
    border-radius: 6px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }
  .wish-checkbox:checked {
    background: #3b82f6;
    border-color: #3b82f6;
  }
  .wish-checkbox:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1px;
    width: 6px;
    height: 11px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  /* 自定义滚动条 */
  .custom-scroll::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div class="w-full max-w-md mx-auto h-screen relative shadow-2xl bg-gray-50 flex flex-col overflow-hidden" style="font-size: 17px">

  <!-- 顶部导航栏 -->
  <div class="flex-shrink-0 bg-white border-b border-gray-100 z-20">
    <div class="flex items-center justify-between px-4 py-3">
      <button onclick="history.back()" class="w-9 h-9 rounded-full bg-gray-100 active:bg-gray-200 flex items-center justify-center transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="text-sm font-semibold text-gray-800">行程协作</div>
      <div class="w-9 h-9"></div>
    </div>
  </div>

  <!-- 内容区 -->
  <div class="flex-1 overflow-y-auto custom-scroll" style="padding-bottom: 120px;">

    <!-- 参与人数提示 -->
    <div class="px-4 pt-3 pb-2">
      <div class="flex items-center gap-2 bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-100 rounded-xl px-3 py-2">
        <div class="flex -space-x-2">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 border-2 border-white flex items-center justify-center text-[10px] font-bold text-white">我</div>
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 border-2 border-white flex items-center justify-center text-[10px] font-bold text-white">李</div>
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 border-2 border-white flex items-center justify-center text-[10px] font-bold text-white">王</div>
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-orange-400 to-amber-500 border-2 border-white flex items-center justify-center text-[10px] font-bold text-white">张</div>
        </div>
        <div class="flex-1 text-xs text-gray-600">
          <span class="font-semibold text-gray-800">4人</span> 正在协作完善行程
        </div>
      </div>
    </div>

    <!-- 核心模块 A：酒店决策区 -->
    <div class="px-4 pt-3 pb-3">
      <div class="flex items-center gap-2 mb-2.5">
        <div class="w-1 h-4 bg-purple-500 rounded-full"></div>
        <h2 class="text-base font-bold text-gray-800">酒店决策投票</h2>
        <span class="ml-auto text-xs text-gray-400">不记名投票</span>
      </div>

      <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm">
        <div class="p-4">
          <!-- 酒店图片和信息 -->
          <div class="flex gap-3">
            <div class="w-20 h-20 rounded-xl overflow-hidden bg-gray-200 flex-shrink-0">
              <img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a?auto=format&fit=crop&w=300&q=80" alt="元通亚朵酒店" class="w-full h-full object-cover">
            </div>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-bold text-gray-900 truncate">南京元通亚朵酒店</div>
              <div class="text-xs text-gray-500 mt-0.5">建邺区 · 奥体中心店</div>
              <div class="flex items-center gap-2 mt-1.5">
                <div class="text-xs bg-blue-50 text-blue-600 rounded px-1.5 py-0.5 font-semibold">4.8</div>
                <div class="text-[10px] text-gray-400" style="font-size: 12px">距奥体中心 800m</div>
              </div>
              <div class="flex items-baseline gap-1 mt-1.5">
                <span class="text-orange-500 text-sm font-bold">¥498</span>
                <span class="text-[10px] text-gray-400">起/晚</span>
              </div>
            </div>
          </div>

          <!-- 投票按钮 -->
          <div class="flex gap-2 mt-4">
            <button id="voteYes" class="flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 transition-all active:scale-[0.98] bg-blue-500 text-white shadow-md">
              <span>👍</span>
              <span>赞同</span>
              <span id="yesCount" class="bg-white/20 rounded px-1.5 text-xs">3</span>
            </button>
            <button id="voteNo" class="flex-1 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-1.5 transition-all active:scale-[0.98] border border-gray-200 text-gray-600 bg-white">
              <span>👎</span>
              <span>换一家</span>
              <span id="noCount" class="bg-gray-100 rounded px-1.5 text-xs text-gray-500">0</span>
            </button>
          </div>

          <!-- 已投票头像列表 -->
          <div class="mt-3 pt-3 border-t border-gray-50">
            <div class="flex items-center gap-2">
              <div class="flex -space-x-2">
                <div class="w-6 h-6 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 border-2 border-white flex items-center justify-center text-[9px] font-bold text-white">我</div>
                <div class="w-6 h-6 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 border-2 border-white flex items-center justify-center text-[9px] font-bold text-white">李</div>
                <div class="w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 border-2 border-white flex items-center justify-center text-[9px] font-bold text-white">王</div>
              </div>
              <div class="text-xs text-gray-500">
                <span class="font-semibold text-gray-700">你、李华、王磊</span> 已赞同
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 核心模块 B：心愿池 -->
    <div class="px-4 pt-2 pb-4">
      <div class="flex items-center gap-2 mb-2.5">
        <div class="w-1 h-4 bg-pink-500 rounded-full"></div>
        <h2 class="text-base font-bold text-gray-800">大家的心愿清单</h2>
        <span id="checkedCountTag" class="ml-auto text-xs bg-pink-50 text-pink-600 rounded-full px-2 py-0.5 font-semibold">已勾选 2 个</span>
      </div>

      <!-- 输入区 -->
      <div class="bg-white rounded-2xl p-3 border border-gray-100 shadow-sm mb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-white">我</div>
          <input id="wishInput" class="flex-1 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-400 transition-colors" placeholder="你也来写下旅行心愿吧...">
          <button onclick="submitWish()" id="sendWishBtn" class="px-4 py-2 bg-blue-500 text-white rounded-xl text-sm font-semibold active:scale-[0.96] transition-transform disabled:bg-gray-300 disabled:cursor-not-allowed">发送</button>
        </div>
      </div>

      <!-- 心愿列表 -->
      <div id="wishList" class="space-y-2.5">

        <!-- 心愿 1：李华 -->
        <div class="wish-item bg-white rounded-2xl p-3.5 border border-gray-100 shadow-sm">
          <div class="flex items-start gap-3">
            <input type="checkbox" class="wish-checkbox" checked onchange="updateCheckedCount()">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-pink-400 to-rose-500 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-white">李</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="text-xs font-semibold text-gray-800">李华</span>
                <span class="text-[10px] text-gray-400">3分钟前</span>
              </div>
              <div class="text-sm text-gray-700">想吃金陵烤鸭 🦆</div>
            </div>
          </div>
        </div>

        <!-- 心愿 2：王磊 -->
        <div class="wish-item bg-white rounded-2xl p-3.5 border border-gray-100 shadow-sm">
          <div class="flex items-start gap-3">
            <input type="checkbox" class="wish-checkbox" onchange="updateCheckedCount()">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-white">王</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="text-xs font-semibold text-gray-800">王磊</span>
                <span class="text-[10px] text-gray-400">1分钟前</span>
              </div>
              <div class="text-sm text-gray-700">晚上想去秦淮河坐船 🚣</div>
            </div>
          </div>
        </div>

        <!-- 心愿 3：你 -->
        <div class="wish-item bg-white rounded-2xl p-3.5 border border-gray-100 shadow-sm ring-1 ring-blue-100">
          <div class="flex items-start gap-3">
            <input type="checkbox" class="wish-checkbox" checked onchange="updateCheckedCount()">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-white">我</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-0.5">
                <span class="text-xs font-semibold text-blue-600">你</span>
                <span class="text-[10px] text-gray-400">刚刚</span>
              </div>
              <div class="text-sm text-gray-700">必须去奥体看周杰伦！ 🎤</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 底部固定操作区 -->
  <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-4 py-3 pb-5 z-50" style="box-shadow: 0 -8px 24px rgba(0,0,0,0.08);">
    <div class="flex items-center gap-3">
      <div class="flex-shrink-0">
        <div class="text-xs text-gray-500">已勾选</div>
        <div class="text-lg font-bold text-gray-800 leading-none mt-0.5"><span id="checkedCount">2</span> <span class="text-xs font-medium text-gray-400">个心愿</span></div>
      </div>
      <button id="mergeBtn" onclick="mergeWishes()" class="flex-1 py-3.5 bg-gradient-to-r from-blue-500 to-indigo-500 text-white rounded-2xl text-sm font-bold shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a4 4 0 0 0-4 4c0 .5.1 1 .3 1.4L6 16h12l-2.3-8.6c.2-.4.3-.9.3-1.4a4 4 0 0 0-4-4z"/>
          <path d="M6 16v5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-5"/>
          <path d="M9 21v-5"/>
          <path d="M15 21v-5"/>
        </svg>
        <span id="mergeBtnText">让 AI 融合心愿并更新行程</span>
      </button>
    </div>
  </div>

  <!-- 成功 Toast -->
  <div id="successToast" class="hidden-el">
    <div class="success-toast">
      <span>✅</span>
      <span id="toastText">行程已更新</span>
    </div>
  </div>

</div>

<script>
// ============ 投票逻辑 ============
let yesVotes = 3;
let noVotes = 0;
let votedYes = true;
let votedNo = false;

document.getElementById('voteYes').addEventListener('click', function() {
  const btn = this;
  if (votedYes) return;
  if (votedNo) {
    noVotes--;
    votedNo = false;
    updateNoStyle(false);
  }
  yesVotes++;
  votedYes = true;
  updateYesStyle(true);
  document.getElementById('yesCount').textContent = yesVotes;
  document.getElementById('noCount').textContent = noVotes;
});

document.getElementById('voteNo').addEventListener('click', function() {
  const btn = this;
  if (votedNo) return;
  if (votedYes) {
    yesVotes--;
    votedYes = false;
    updateYesStyle(false);
  }
  noVotes++;
  votedNo = true;
  updateNoStyle(true);
  document.getElementById('yesCount').textContent = yesVotes;
  document.getElementById('noCount').textContent = noVotes;
});

function updateYesStyle(active) {
  const btn = document.getElementById('voteYes');
  if (active) {
    btn.classList.remove('border', 'border-gray-200', 'text-gray-600', 'bg-white');
    btn.classList.add('bg-blue-500', 'text-white', 'shadow-md');
    btn.querySelector('span:last-child').classList.remove('bg-gray-100', 'text-gray-500');
    btn.querySelector('span:last-child').classList.add('bg-white/20');
  } else {
    btn.classList.add('border', 'border-gray-200', 'text-gray-600', 'bg-white');
    btn.classList.remove('bg-blue-500', 'text-white', 'shadow-md');
    btn.querySelector('span:last-child').classList.add('bg-gray-100', 'text-gray-500');
    btn.querySelector('span:last-child').classList.remove('bg-white/20');
  }
}
function updateNoStyle(active) {
  const btn = document.getElementById('voteNo');
  if (active) {
    btn.classList.remove('border', 'border-gray-200', 'text-gray-600', 'bg-white');
    btn.classList.add('bg-red-500', 'text-white', 'shadow-md');
    btn.querySelector('span:last-child').classList.remove('bg-gray-100', 'text-gray-500');
    btn.querySelector('span:last-child').classList.add('bg-white/20', 'text-white');
  } else {
    btn.classList.add('border', 'border-gray-200', 'text-gray-600', 'bg-white');
    btn.classList.remove('bg-red-500', 'text-white', 'shadow-md');
    btn.querySelector('span:last-child').classList.add('bg-gray-100', 'text-gray-500');
    btn.querySelector('span:last-child').classList.remove('bg-white/20', 'text-white');
  }
}

// ============ 心愿勾选计数 ============
function updateCheckedCount() {
  const boxes = document.querySelectorAll('.wish-checkbox');
  let count = 0;
  boxes.forEach(b => { if (b.checked) count++; });
  document.getElementById('checkedCount').textContent = count;
  document.getElementById('checkedCountTag').textContent = `已勾选 ${count} 个`;
}

// ============ 提交心愿 ============
function submitWish() {
  const input = document.getElementById('wishInput');
  const text = input.value.trim();
  if (!text) return;

  const list = document.getElementById('wishList');
  const newEl = document.createElement('div');
  newEl.className = 'wish-item bg-white rounded-2xl p-3.5 border border-gray-100 shadow-sm ring-1 ring-blue-100';
  newEl.innerHTML = `
    <div class="flex items-start gap-3">
      <input type="checkbox" class="wish-checkbox" onchange="updateCheckedCount()">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-400 to-blue-600 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-white">我</div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-0.5">
          <span class="text-xs font-semibold text-blue-600">你</span>
          <span class="text-[10px] text-gray-400">刚刚</span>
        </div>
        <div class="text-sm text-gray-700">${text.replace(/[<>&]/g, s => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))}</div>
      </div>
    </div>
  `;
  list.insertBefore(newEl, list.firstChild);
  input.value = '';
  updateCheckedCount();
}

document.getElementById('wishInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitWish();
});

// ============ AI 融合心愿 ============
let merging = false;
function mergeWishes() {
  if (merging) return;
  merging = true;

  const btn = document.getElementById('mergeBtn');
  const btnText = document.getElementById('mergeBtnText');
  btn.disabled = true;

  // 替换按钮内容为 loading 状态
  btnText.textContent = 'AI 正在重算行程...';
  const iconSvg = btn.querySelector('svg');
  if (iconSvg) iconSvg.remove();
  const loader = document.createElement('span');
  loader.className = 'btn-loader';
  btn.insertBefore(loader, btn.firstChild);
  btn.classList.add('opacity-90');

  setTimeout(function() {
    // 显示成功 Toast
    const toast = document.getElementById('successToast');
    toast.classList.remove('hidden-el');
    // 1.5秒后跳转
    setTimeout(function() {
      window.location.href = 'view3_timeline.html';
    }, 1500);
  }, 1500);
}
</script>
</body>
</html>
